name: ci-test-coverage

on:
  push:
    branches:
      - "main"
      - "v*x"
    tags:
      - "v*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  test:
    name: Run pytest and coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            conda_file: envs/osop-spec-file-linux.yml
          - os: windows-latest
            conda_file: envs/osop-cpu-win.yml

    defaults:
      run:
        shell: bash -el {0}

    env:
      ENV_NAME: "osop"
    
    permissions:
      contents: write        # For checkout and comparing commits
      pull-requests: write  # For creating/updating PR comments
    

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: "environment configure"
        env:
          # Maximum cache period (in weeks) before forcing a cache refresh.
          CACHE_WEEKS: 2
        run: |
          echo "CACHE_PERIOD=$(date +%Y).$(expr $(date +%U) / ${CACHE_WEEKS})" >> ${GITHUB_ENV}
          echo "CONDA_FILE=${{ matrix.conda_file }}" >> ${GITHUB_ENV}

      - name: "conda package cache"
        uses: ./.github/workflows/composite/conda-pkg-cache
        with:
          cache_build: 6
          cache_period: ${{ env.CACHE_PERIOD }}
          env_name: ${{ env.ENV_NAME }}
          
      - name: "conda install"
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          activate-environment: ${{ env.ENV_NAME }}
          environment-file: envs/osop-linux-spec-file.yml
          auto-update-conda: false
          conda-remove-defaults: true

      - name: "conda environment cache"
        uses: ./.github/workflows/composite/conda-env-cache
        with:
          cache_build: 6
          cache_period: ${{ env.CACHE_PERIOD }}
          env_name: ${{ env.ENV_NAME }}
          install_packages: "pip"

      - name: "conda info"
        run: |
          conda info
          conda list

      - name: Run tests
        run: pytest -vv -s --maxfail=1 -m "not integration" --junitxml=pytest.xml --cov-report=term-missing:skip-covered --cov | tee pytest-coverage.txt

      - name: Pytest coverage comment
        if: runner.os == 'Linux'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
