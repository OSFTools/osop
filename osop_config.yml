workflow:
  hindcast: true
  forecast: false

parameters:
  month: 11
  leads: "2,3,4"
  area: "34,22,21,38" # Target area for the forecast (north, west, south, east)
  variable: "total_precipitation"
  location: "Egypt"
  method: "pmesh"
  pycpt: true
  predictor_area: "40,0,-40,359" # Predictor area if using PyCPT (north, west, south, east)
  forecast_year: 2025

paths:
  base: "./output/egypt_demo"
  logdir: "{base}/logfiles"
  hindcast:
    downloads: "{base}/hindcast/downloads"
    products: "{base}/hindcast/products"
    scores: "{base}/hindcast/scores"
    plots: "{base}/hindcast/plots"
    pycpt: "{base}/hindcast/pycpt"
  forecast:
    downloads: "{base}/forecast/downloads"
    products: "{base}/forecast/products"
    scores: "{base}/forecast/scores"
    plots: "{base}/forecast/plots"
    pycpt: "{base}/forecast/pycpt"

# available centres as of 2026-09-02: 
#   - meteo_france
#  - dwd
#  - cmcc
#  - ncep
#  - ukmo
#  - ecmwf
#  - eccc
#  - bom
#  - mme - multi model ensemble (combination of all centres included in the config file)
centres: 
  - dwd
  - ukmo
  - ecmwf
  - mme

services:
  ecmwf: [51, 1]
  dwd: [22, 1]
  ukmo: [604, 1]
  mme: [1, 0]
